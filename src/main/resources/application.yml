###############################################
# 🔵  CONFIG CI/CD POUR JENKINS (H2 IN MEMORY)
###############################################

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  # Désactiver Flyway (évite les échecs en CI)
  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Cloudinary désactivé pour Jenkins (mock)
cloudinary:
  cloud_name: dummy
  api_key: dummy
  api_secret: dummy

# JWT fake values pour CI
jwt_secret: ci-secret-key-123456
jwt:
  expiration-time: 3600000
  issuer: CI_PIPELINE

server:
  port: 0   # port aléatoire pour éviter les conflits

logging:
  level:
    root: ERROR
    org.springframework: WARN
    org.hibernate: WARN
