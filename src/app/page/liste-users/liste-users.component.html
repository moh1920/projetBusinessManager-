<table *ngIf=" users.length > 0" border="1" cellpadding="8" cellspacing="0">
  <thead>
  <tr>

    <th>Role</th>
    <th>Nom d'utilisateur</th>
    <th>Prénom</th>
    <th>Nom</th>
    <th>Email</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let user of users">
    <td>{{ user.roleUser }}</td>
    <td>{{ user.username }}</td>
    <td>{{ user.firstName || 'N/A' }}</td>
    <td>{{ user.lastName|| 'N/A' }}</td>
    <td>{{ user.email || 'N/A' }}</td>
  </tr>
  </tbody>
</table>
