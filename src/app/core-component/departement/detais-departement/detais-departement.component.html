<div class="container mt-4">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Modifier le département</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #departementForm="ngForm">

        <div class="mb-3">
          <label for="nom" class="form-label">Nom</label>
          <input type="text" id="nom" class="form-control" name="nom" [(ngModel)]="departement.nom" required>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" class="form-control" name="description" [(ngModel)]="departement.description" rows="3"></textarea>
        </div>

        <div class="mb-3">
          <label for="responsable" class="form-label">Responsable</label>
          <input type="text" id="responsable" class="form-control" name="responsable" [(ngModel)]="departement.responsable" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" name="email" [(ngModel)]="departement.email" required>
        </div>

        <div class="mb-3">
          <label for="telephone" class="form-label">Téléphone</label>
          <input type="text" id="telephone" class="form-control" name="telephone" [(ngModel)]="departement.telephone">
        </div>

        <div class="mb-3">
          <label for="nombreEmployes" class="form-label">Nombre d'employés</label>
          <input type="number" id="nombreEmployes" class="form-control" name="nombreEmployes" [(ngModel)]="departement.nombreEmployes" min="0">
        </div>

        <div class="mb-3">
          <label for="entrepriseNom" class="form-label">Entreprise</label>
          <input type="text" id="entrepriseNom" class="form-control" name="entrepriseNom" [(ngModel)]="departement.entrepriseNom" required>

        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!departementForm.form.valid" *ngIf="permissionEntreprise.update">Enregistrer</button>
      </form>
    </div>
  </div>
</div>
