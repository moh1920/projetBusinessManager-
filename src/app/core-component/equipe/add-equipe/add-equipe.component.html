<!-- Page Header -->
<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Vertical Form</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a [routerLink] = "routes.adminDashboard">Dashboard</a></li>
        <li class="breadcrumb-item active">Vertical Form</li>
      </ul>
    </div>
  </div>
</div>
<!-- /Page Header -->


<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Ajouter une Equipe
        </h5>
      </div>
      <div class="card-body">
        <form [formGroup]="equipeForm" (ngSubmit)="onSubmit()">
          <div class="row">


            <div class="col-lg-6">
              <div class="input-blocks">
                <label>nom</label>
                <input type="text" class="form-control" formControlName="nom">
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea formControlName="description" class="form-control" rows="4"></textarea>
              </div>
            </div>
            <div class="mb-3">
              <label for="dateCreation" class="form-label">Date de création</label>
              <input type="date" id="dateCreation" formControlName="dateCreation" class="form-control">
            </div>








          </div>


          <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-cancel me-2">Cancel</button>
            <button type="submit" class="btn btn-submit" >Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
