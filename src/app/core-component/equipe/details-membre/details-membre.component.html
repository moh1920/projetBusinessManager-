<div class="container mt-5">
  <div class="card shadow rounded-4">
    <div class="card-header bg-primary text-white rounded-top-4">
      <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Modifier Membre</h5>
    </div>

    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #membreForm="ngForm">

        <!-- Section Membre -->
        <h6 class="mb-3 border-bottom pb-2 text-primary fw-bold">
          <i class="bi bi-person-fill me-1"></i> Informations du Membre
        </h6>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="membreTitre" class="form-label">Titre</label>
            <input type="text" id="membreTitre" class="form-control" name="membreTitre"
                   [(ngModel)]="membredetails.membreTitre" required>
          </div>

          <div class="col-md-6 mb-3">
            <label for="specialite" class="form-label">Spécialité</label>
            <input type="text" id="specialite" class="form-control" name="specialite"
                   [(ngModel)]="membredetails.specialite" required>
          </div>

          <div class="col-12 mb-3">
            <label  class="form-label">Description</label>
            <input type="text"  class="form-control" name="description"
                   [(ngModel)]="membredetails.description" required>
          </div>
        </div>

        <!-- Utilisateurs associés -->
        <div *ngIf="membredetails.users?.length" class="mb-4">
          <p class="fw-bold text-secondary mb-2"><i class="bi bi-people-fill me-1"></i> Utilisateurs associés :</p>
          <ul class="list-group">
            <li class="list-group-item" *ngFor="let user of membredetails.users">
              <strong>Nom :</strong> {{ user.username }} -
              <strong>Email :</strong> {{ user.email }}
            </li>
          </ul>
        </div>

        <!-- Bouton Submit -->
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success px-4" [disabled]="!membreForm.form.valid">
            <i class="bi bi-save me-1"></i> Enregistrer
          </button>
        </div>

        <!-- Section Equipe -->
        <h6 class="mb-3 border-bottom pb-2 text-primary fw-bold">
          <i class="bi bi-people me-1"></i> Informations de l'Équipe
        </h6>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="nom" class="form-label">Nom</label>
            <input type="text" id="nom" class="form-control" name="nom"
                   [(ngModel)]="equipeMembre.nom" required>
          </div>

          <div class="col-md-6 mb-3">
            <label  class="form-label">Equipe description</label>
            <input type="text" class="form-control"
                   [(ngModel)]="equipeMembre.description" required>
          </div>

          <div class="col-md-6 mb-4">
            <label for="dateCreation" class="form-label">Date de Création</label>
            <input type="date" id="dateCreation" class="form-control" name="dateCreation"
                   [(ngModel)]="equipeMembre.dateCreation">
          </div>
        </div>


      </form>
    </div>
  </div>
</div>
