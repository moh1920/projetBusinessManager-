<!-- Page Header -->
<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Vertical Form</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a [routerLink] = "routes.adminDashboard">Dashboard</a></li>
        <li class="breadcrumb-item active">Vertical Form</li>
      </ul>
    </div>
  </div>
</div>
<!-- /Page Header -->


<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Ajouter une User
        </h5>
      </div>
      <div class="card-body">
        <form [formGroup]="addUserForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-lg-12">
              <div class="new-employee-field">
                <span>Avatar</span>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>User Name</label>
                <input type="text" class="form-control" formControlName="username">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Phone</label>
                <input type="text" class="form-control" formControlName="phone">
              </div>
            </div>

            <div class="col-lg-6">
              <div class="input-blocks">
                <label>Email</label>
                <input type="email" class="form-control" formControlName="email">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Entreprise</label>
              <select class="form-select" formControlName="entrepriseId">
                <option *ngFor="let e of entreprises" [value]="e.id">{{ e.nom }}</option>
              </select>
            </div>


            <div class="col-lg-6">
              <div class="input-blocks position-relative">
                <label>Password</label>
                <input type="password" formControlName="password" class="form-control" autocomplete="new-password">
<!--                <i class="feather icon-eye toggle-password"-->
<!--                   (click)="togglePassword('password')"-->
<!--                   style="position: absolute; top: 38px; right: 10px; cursor: pointer;"></i> -->
                <i class="feather icon-eye toggle-password"
                   style="position: absolute; top: 38px; right: 10px; cursor: pointer;"></i>
              </div>
            </div>

<!--            <div class="col-lg-6">-->
<!--              <div class="input-blocks position-relative">-->
<!--                <label>Confirm Password</label>-->
<!--                <input type="password" formControlName="confirmPassword" class="form-control" autocomplete="new-password">-->
<!--                <i class="feather icon-eye toggle-password"-->
<!--                   (click)="togglePassword('confirmPassword')"-->
<!--                   style="position: absolute; top: 38px; right: 10px; cursor: pointer;"></i>-->
<!--                <div *ngIf="addUserForm.get('confirmPassword')?.errors?.['passwordMismatch'] && addUserForm.get('confirmPassword')?.touched"-->
<!--                     class="text-danger mt-1">-->
<!--                  Les mots de passe ne correspondent pas.-->
<!--                </div>-->
<!--              </div>-->
<!--            </div>-->

          </div>


          <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-cancel me-2">Cancel</button>
            <button type="submit" class="btn btn-submit" >Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
