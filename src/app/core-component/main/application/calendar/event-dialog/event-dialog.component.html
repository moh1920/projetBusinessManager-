<div class="modal-overlay" id="eventModal" >
  <div class="modal-container">
    <div class="modal-header">
      <h2>Créer un événement</h2>
      <button class="close-btn" (click)="onCancel()" type="button" aria-label="Fermer modal">×</button>
    </div>

    <div class="modal-body">
      <form class="event-form" (ngSubmit)="onSave()" #eventForm="ngForm">
        <div class="form-group">
          <label for="title">Titre</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="Titre de l'événement"
            [(ngModel)]="title"
            required
            #titleInput="ngModel"
          />
          <div *ngIf="titleInput.invalid && titleInput.touched" class="error">
            Le titre est requis.
          </div>
        </div>

        <div class="form-group">
          <label for="categorie">Catégorie</label>
          <select
            id="categorie"
            name="categorie"
            [(ngModel)]="selectedCategorieId"
            required
            #categorieInput="ngModel"
          >
            <option value="" disabled>Sélectionner une catégorie</option>
            <option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.titre }}
            </option>
          </select>
          <div *ngIf="categorieInput.invalid && categorieInput.touched" class="error">
            La catégorie est requise.
          </div>
        </div>


        <div class="form-actions">
          <button type="button" class="btn btn-cancel" (click)="onCancel()">Annuler</button>
          <button type="submit" class="btn btn-primary" [disabled]="eventForm.invalid">Créer</button>
        </div>
      </form>
    </div>
  </div>
</div>
