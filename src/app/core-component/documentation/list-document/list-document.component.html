<!-- Page Header -->
<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4>List Entreprise</h4>
      <h6>Departement Entreprise</h6>
    </div>
  </div>
  <ul class="table-top-head">
    <li>
      <a data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Pdf" matTooltipPosition="above"><img
        src="assets/img/icons/pdf.svg" alt="img"></a>
    </li>
    <li>
      <a data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Excel" matTooltipPosition="above"><img
        src="assets/img/icons/excel.svg" alt="img"></a>
    </li>
    <li>
      <a data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Print" matTooltipPosition="above"><i
        class="feather icon-printer feather-rotate-ccw"></i></a>
    </li>
    <li>
      <a data-bs-toggle="tooltip" data-bs-placement="top" matTooltip="Refresh" matTooltipPosition="above"><i
        class="feather icon-rotate-ccw feather-rotate-ccw"></i></a>
    </li>

  </ul>
    <a (click)="addDocument()" class="btn btn-added" data-bs-toggle="modal" data-bs-target="#add-units">
      <i class="feather icon-plus-circle me-2"></i>Ajouter Entreprise
    </a>
  </div>
<!-- /Page Header -->
<!-- Table responsive -->
<div class="row">
  <div class="col-xl-12">
    <div class="card">
      <div class="card-header justify-content-between">
        <div class="card-title">
          Liste des documents
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table text-nowrap">
            <thead>
            <tr>
              <th>Nom</th>
              <th>Type</th>
              <th>Catégorie</th>
              <th>Date d'ajout</th>
              <th>Fichier</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let doc of documentList">
              <td>{{ doc.nom }}</td>
              <td>{{ doc.type }}</td>
              <td>{{ doc.categorieDocument?.nom }}</td>
              <td>{{ doc.dateAjout | date: 'short' }}</td>
              <td>
                <a [href]="'https://docs.google.com/viewer?url=' + doc.fileChemin?.urLPdf" target="_blank">
                  Ouvrir
                </a>

              </td>


              <td class="action-table-data">
                <div class="edit-delete-action">
                  <a class="me-2 p-2 mb-0" (click)="viewDocument(doc.id)" >
                    <i class="feather icon-eye action-eye"></i>
                  </a>
                  <a class="me-2 confirm-text p-2 mb-0" (click)="deleteDocument(doc.id)" >
                    <i class="feather icon-trash-2 feather-trash-2"></i>
                  </a>
                </div>
              </td>
            </tr>
            <tr *ngIf="documentList.length === 0">
              <td colspan="6" class="text-center">Aucun document trouvé.</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- /Table responsive -->
