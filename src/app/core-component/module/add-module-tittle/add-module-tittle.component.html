<!-- Page Header -->
<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Vertical Form</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a [routerLink] = "routes.adminDashboard">Dashboard</a></li>
        <li class="breadcrumb-item active">Vertical Form</li>
      </ul>
    </div>
  </div>
</div>
<!-- /Page Header -->



<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Ajouter une module</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="moduleTittleForm" (ngSubmit)="createModuleTittle()">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Titre de module</label>
                <input type="text" formControlName="moduleTittle" class="form-control" />
              </div>

            </div>

          </div>

          <div class="text-end mt-3">
            <button type="submit" class="btn btn-primary" [disabled]="!moduleTittleForm.valid">
              Créer module
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
