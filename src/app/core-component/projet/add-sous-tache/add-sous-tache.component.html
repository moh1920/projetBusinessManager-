<!-- Page Header -->
<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Vertical Form</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a [routerLink] = "routes.adminDashboard">Dashboard</a></li>
        <li class="breadcrumb-item active">Vertical Form</li>
      </ul>
    </div>
  </div>
</div>
<!-- /Page Header -->


<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Ajouter une Sous-Tâche</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="sousTacheForm" (ngSubmit)="onSubmit()">
          <div class="row">

            <div class="col-lg-6 mb-3">
              <label for="titre" class="form-label">Titre *</label>
              <input type="text" id="titre" class="form-control" formControlName="titre" placeholder="Titre de la sous-tâche">
              <div *ngIf="sousTacheForm.get('titre')?.invalid && sousTacheForm.get('titre')?.touched" class="text-danger small mt-1">
                Le titre est obligatoire.
              </div>
            </div>

            <div class="col-lg-6 mb-3">
              <label for="type" class="form-label">Type *</label>
              <select id="type" class="form-select" formControlName="type">
                <option value="">--Choisir un type--</option>
                <option value="TECHNIQUE">TECHNIQUE</option>
                <option value="DOCUMENTATION">DOCUMENTATION</option>
                <option value="REVUE">REVUE</option>
              </select>
              <div *ngIf="sousTacheForm.get('type')?.invalid && sousTacheForm.get('type')?.touched" class="text-danger small mt-1">
                Le type est obligatoire.
              </div>
            </div>

            <div class="col-lg-12 mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea id="description" rows="4" class="form-control" formControlName="description" placeholder="Description de la sous-tâche"></textarea>
            </div>

            <div class="col-lg-4 mb-3">
              <label for="dateDebut" class="form-label">Date début</label>
              <input type="date" id="dateDebut" class="form-control" formControlName="dateDebut">
            </div>

            <div class="col-lg-4 mb-3">
              <label for="dateFin" class="form-label">Date fin</label>
              <input type="date" id="dateFin" class="form-control" formControlName="dateFin">
            </div>

            <div class="col-lg-6 mb-3">
              <label for="idCategorieTache" class="form-label">Catégorie de la tâche</label>
              <select id="idCategorieTache" formControlName="idCategorieTache" class="form-control">
                <option value="">--Choisir un Categorie--</option>
                <option *ngFor="let c of categorieSousTache" [value]="c.id">{{ c.nom }}</option>
              </select>
            </div>


            <div class="col-lg-4 mb-3">
              <label for="progres" class="form-label">Progression (%)</label>
              <input type="number" id="progres" min="0" max="100" class="form-control" formControlName="progres" placeholder="0 - 100">
            </div>

            <div class="col-lg-4 mb-3">
              <label for="duree" class="form-label">Durée (jours)</label>
              <input type="number" id="duree" min="0" class="form-control" formControlName="duree" placeholder="Nombre de jours">
            </div>

          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-secondary me-2" (click)="sousTacheForm.reset()">Annuler</button>
            <button type="submit" class="btn btn-primary" [disabled]="sousTacheForm.invalid">Ajouter</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
