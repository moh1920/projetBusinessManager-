<!-- Page Header -->
<div class="page-header">
  <div class="row">
    <div class="col">
      <h3 class="page-title">Vertical Form</h3>
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a [routerLink] = "routes.adminDashboard">Dashboard</a></li>
        <li class="breadcrumb-item active">Vertical Form</li>
      </ul>
    </div>
  </div>
</div>
<!-- /Page Header -->




<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Ajouter une Tâche</h5>
      </div>
      <div class="card-body">
        <form [formGroup]="tacheForm" (ngSubmit)="onSubmit()">
          <div class="row">

            <!-- Colonne gauche -->
            <div class="col-lg-6">
              <div class="mb-3">
                <label for="titre" class="form-label">Titre</label>
                <input type="text" id="titre" formControlName="titre" class="form-control" placeholder="Titre">
              </div>

              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" formControlName="description" class="form-control" rows="4" placeholder="Description"></textarea>
              </div>

              <div class="mb-3">
                <label for="idCategorieTache" class="form-label">Catégorie de la tâche</label>
                <select id="idCategorieTache" formControlName="idCategorieTache" class="form-control">
                  <option *ngFor="let c of categorieTache" [value]="c.id">{{ c.nom }}</option>
                </select>
              </div>
            </div>

            <!-- Progression -->
            <div class="mb-3">
              <label for="progres" class="form-label">Progression (%)</label>
              <input type="number" id="progres" formControlName="progres" class="form-control" min="0" max="100" placeholder="0 à 100">
            </div>

            <!-- Durée -->
            <div class="mb-3">
              <label for="duree" class="form-label">Durée (en heures)</label>
              <input type="number" id="duree" formControlName="duree" class="form-control" min="0" placeholder="Durée">
            </div>


            <!-- Prédecesseurs -->
            <div class="mb-3">
              <label class="form-label">Tâches Prédécesseurs</label>
              <div class="form-check" *ngFor="let t of listTachePredecesseur">
                <input
                  type="checkbox"
                  class="form-check-input"
                  [id]="'tache-' + t.id"
                  [value]="t.id">
                <label class="form-check-label" [for]="'tache-' + t.id">{{ t.titre }}</label>
              </div>
            </div>



            <!-- Colonne droite -->
            <div class="col-lg-6">
              <div class="mb-3">
                <label for="dateDebut" class="form-label">Date de début</label>
                <input type="date" id="dateDebut" formControlName="dateDebut" class="form-control">
              </div>

              <div class="mb-3">
                <label for="dateFin" class="form-label">Date de fin</label>
                <input type="date" id="dateFin" formControlName="dateFin" class="form-control">
              </div>

              <div class="mb-3">
                <label for="statut" class="form-label">Statut</label>
                <select id="statut" formControlName="statut" class="form-control">
                  <option *ngFor="let s of statuts" [value]="s">{{ s }}</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="priorite" class="form-label">Priorité</label>
                <select id="priorite" formControlName="priorite" class="form-control">
                  <option *ngFor="let p of priorites" [value]="p">{{ p }}</option>
                </select>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4">
            <button type="button" class="btn btn-cancel me-2">Annuler</button>
            <button type="submit" class="btn btn-submit">Ajouter</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
