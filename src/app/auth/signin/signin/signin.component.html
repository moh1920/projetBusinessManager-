<div class="account-content">
  <div class="login-wrapper bg-img">
    <div class="login-content">
      <form [formGroup]="loginForm" (ngSubmit)="navigation()">
        <div class="login-userset">
          <div class="login-logo logo-normal">
            <img src="assets/img/logo.png" alt="img">
          </div>
          <a [routerLink]="routes.adminDashboard" class="login-logo logo-white">
            <img src="assets/img/logo-white.png" alt="">
          </a>

          <div class="login-userheading">
            <h3>Sign In</h3>
            <h4>Access the Dreamspos panel using your email and passcode.</h4>
          </div>

          <div class="form-login mb-3">
            <label class="form-label">Username</label>
            <div class="form-addons">
              <input
                type="text"
                id="username"
                formControlName="username"
                class="form-control"
                [class.is-invalid]="f['username'].invalid && f['username'].touched"
                placeholder="Entrez votre nom d'utilisateur">
              <img src="assets/img/icons/mail.svg" alt="img">
            </div>
          </div>

          <div class="form-login mb-3">
            <label class="form-label">Password</label>
            <div class="pass-group">
              <input
                [type]="password[0] ? 'text' : 'password'"
                id="password"
                formControlName="password"
                class="form-control"
                [class.is-invalid]="f['password'].invalid && f['password'].touched"
                placeholder="Entrez votre mot de passe">
              <span class="fas toggle-password"
                    [ngClass]="password[0] ? 'fa-eye' : 'fa-eye-slash'"
                    (click)="togglePassword(0)">
              </span>
            </div>
          </div>

          <div class="form-login authentication-check">
            <div class="row">
              <div class="col-12 d-flex align-items-center justify-content-between">
                <div class="custom-control custom-checkbox custom-class-check">
                  <label class="checkboxs ps-4 mb-0 pb-0 line-height-1">
                    <input type="checkbox" class="form-control">
                    <span class="checkmarks"></span>Remember me
                  </label>
                </div>
                <div class="text-end">
                  <a class="forgot-link" [routerLink]="routes.forgotPassword">Forgot Password?</a>
                </div>
              </div>
            </div>
          </div>

          <div class="form-login">
            <button type="submit" class="btn btn-login" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
              Sign In
            </button>
          </div>

          <div class="signinform">
            <h4>New on our platform?<a [routerLink]="routes.registerbyStepper" class="hover-a"> Create an account</a></h4>
          </div>

          <div class="form-setlogin or-text">
            <h4>OR</h4>
          </div>

          <div class="form-sociallink">
            <ul class="d-flex">
              <li>
                <a href="javascript:void(0);" class="facebook-logo">
                  <img src="assets/img/icons/facebook-logo.svg" alt="Facebook">
                </a>
              </li>
              <li>
                <a href="javascript:void(0);">
                  <img src="assets/img/icons/google.png" alt="Google">
                </a>
              </li>
              <li>
                <a href="javascript:void(0);" class="apple-logo">
                  <img src="assets/img/icons/apple-logo.svg" alt="Apple">
                </a>
              </li>
            </ul>
            <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
              <p>Copyright &copy; 2023 DreamsPOS. All rights reserved</p>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
