services:
  postgres:
    container_name: postgres-sql-BusinessManager
    image: postgres
    environment:
      POSTGRES_USER: sayari
      POSTGRES_PASSWORD: sayari
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: BusinessManager
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - spring-demo
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev-BusinessManager
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
    networks:
      - spring-demo
    restart: unless-stopped

volumes:
  postgres:

networks:
  spring-demo:
